; F1 CE steering wheel profile (launcher: Steering Wheel tab, Profile). [wheel] holds the same keys as
; the [wheel] section of f1ce_launcher.ini (runtime/wheel_config.h). Axes and buttons count from 0
; (DirectInput / SDL order); axes, paddles, shifter and minimum force after Assetto Corsa's presets.
[profile]
name=Logitech G27
wheels=046d:c29b
notes=H-shifter on buttons 8-13, reverse 14 (clear the gears for the paddles). Wheel at 900 degrees in G HUB / LGS.

